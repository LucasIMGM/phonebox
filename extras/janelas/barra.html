<style>
  body { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 8px 0; box-sizing: border-box; }
  button { all: unset; box-sizing: border-box; width: min(46px, 78vw); height: min(46px, 78vw); border-radius: 12px;
           background: #1b222ccc; border: 1px solid #2a3340; display: grid; place-items: center; color: #cfd6df;
           cursor: pointer; transition: transform .08s, background-color .15s, color .15s; }
  button:active, button.press { transform: scale(.9); background: #2dd4bf33; color: #2dd4bf; }
  svg { width: 58%; height: 58%; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style>
<button id="monitor" aria-label="Ligar ou desligar o monitor">
  <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
</button>
<button id="janelas" aria-label="Janelas abertas no PC">
  <svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg>
</button>
<script>
  // Barra pequena da página inicial: o monitor usa o atalho "tela" (desliga / liga, alternando) e as janelas abrem a
  // página "janelas", que volta sozinha para cá depois que você escolhe uma.
  function press(b) { b.classList.add('press'); setTimeout(function () { b.classList.remove('press'); }, 160); }
  document.getElementById('monitor').addEventListener('click', function () { press(this); phonebox.run('tela'); });
  document.getElementById('janelas').addEventListener('click', function () { press(this); phonebox.goto('janelas'); });
</script>
